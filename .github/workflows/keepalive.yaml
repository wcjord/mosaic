name: Daily backup + keep-alive
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot the public project data
        run: |
          KEY="sb_publishable_Ic_6BjCADfZN8wVlrMCTgA_WhbMFh3j"
          BASE="https://qythjcoxbwwmdmevvpdx.supabase.co"
          mkdir -p backup
          fail=0
          # Only tables whose contents are already public on the site.
          # rsvps, subscribers, stewards and profiles.email hold personal data
          # and must never land in this repo, which is public.
          for t in features overlays projects events; do
            code=$(curl -s -o "backup/$t.raw" -w "%{http_code}" \
              "$BASE/rest/v1/$t?select=*&order=id" -H "apikey: $KEY")
            echo "$t: $code"
            if [ "$code" != "200" ]; then fail=1; continue; fi
            python3 -m json.tool "backup/$t.raw" > "backup/$t.json" && rm "backup/$t.raw"
          done
          # profiles: public columns only, never the email
          code=$(curl -s -o backup/profiles.raw -w "%{http_code}" \
            "$BASE/rest/v1/profiles?select=id,display_name,avatar_url&order=id" -H "apikey: $KEY")
          echo "profiles: $code"
          if [ "$code" = "200" ]; then
            python3 -m json.tool backup/profiles.raw > backup/profiles.json && rm backup/profiles.raw
          else fail=1; fi
          if [ "$fail" = "1" ]; then
            echo "::warning::A table could not be read (project paused?). Restore at https://supabase.com/dashboard/project/qythjcoxbwwmdmevvpdx"
            exit 1
          fi
          grep -ril "@" backup/*.json | while read f; do
            if grep -qE '"email"' "$f"; then echo "::error::$f contains an email field"; exit 1; fi
          done
      - name: Commit snapshot if changed
        run: |
          git config user.name "backup-bot"
          git config user.email "actions@github.com"
          git add backup/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Daily backup of public project data"
          git push
